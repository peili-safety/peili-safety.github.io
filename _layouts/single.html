---
layout: default
---
<article class="post reading-column">
  <header class="mb-4"><h1 class="title">{{ page.title }}</h1>{% if page.date %}<p class="smallnote text-gray">{{ page.date | date: '%B %-d, %Y' }}</p>{% endif %}</header>
  {{ content }}
  {% if page.paperurl %}<p><a href="{{ page.paperurl }}">Download paper</a></p>{% endif %}
</article>
